services:
  lx-downloader:
    image: node:18-alpine
    container_name: lx-downloader
    restart: unless-stopped
    ports:
      - "5200:5200"
    volumes:
      - ./app:/app
      - ./downloads:/downloads
    working_dir: /app
    command: sh -c "apk add --no-cache ffmpeg || true; npm install --production --registry=https://registry.npmmirror.com && node server.js"
    environment:
      - PORT=5200
      - DOWNLOAD_DIR=/downloads
      - DATA_DIR=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
