<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>落雪音乐下载器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background:#0f1117; color:#e0e0e0; min-height:100vh; padding-bottom:70px; padding-top:48px; }
.header { background:#161b22; padding:10px 16px; display:flex; gap:6px; position:sticky; top:48px; z-index:100; flex-wrap:wrap; }
.topbar { position:fixed; top:0; left:0; right:0; height:48px; background:#0d1117; border-bottom:1px solid #30363d; display:flex; align-items:center; justify-content:space-between; padding:0 16px; z-index:150; }
.topbar .app-title { font-size:16px; font-weight:bold; color:#58a6ff; }
.topbar .settings-btn { width:36px; height:36px; border-radius:50%; border:none; background:#21262d; color:#c9d1d9; cursor:pointer; font-size:18px; }
.topbar .settings-btn:hover { background:#30363d; }
.header button { padding:8px 14px; border:none; border-radius:6px; background:#21262d; color:#c9d1d9; cursor:pointer; font-size:13px; }
.header button.active { background:#1f6feb; color:#fff; }
.container { max-width:900px; margin:0 auto; padding:16px; }
.card { background:#161b22; border-radius:10px; padding:16px; margin-bottom:16px; }
.card h3 { margin-bottom:12px; color:#58a6ff; font-size:15px; }
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.toolbar select, .toolbar input[type=text] { padding:8px; border-radius:6px; border:1px solid #30363d; background:#0d1117; color:#e0e0e0; font-size:13px; }
.toolbar input[type=text] { flex:1; min-width:120px; }
.btn { padding:7px 14px; border:none; border-radius:6px; cursor:pointer; font-size:13px; }
.btn-primary { background:#1f6feb; color:#fff; }
.btn-danger { background:#da3633; color:#fff; }
.btn-sm { padding:5px 10px; font-size:12px; }
.song-list { max-height:60vh; overflow-y:auto; }
.song-item { display:flex; align-items:center; padding:7px 10px; border-bottom:1px solid #21262d; }
.song-item:hover { background:#161b22; }
.song-item .idx { color:#6e7681; width:28px; font-size:12px; }
.song-item .name { flex:1; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.song-item .artist { color:#6e7681; font-size:12px; margin-left:8px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.checkbox { width:16px; height:16px; margin-right:8px; cursor:pointer; }
.progress-bar { height:6px; background:#21262d; border-radius:3px; overflow:hidden; margin:8px 0; }
.progress-fill { height:100%; background:#1f6feb; transition:width 0.3s; }
.tip { color:#6e7681; font-size:12px; margin-top:6px; }
.hidden { display:none; }
.upload-area { border:2px dashed #30363d; padding:16px; text-align:center; border-radius:8px; cursor:pointer; }
.upload-area:hover { border-color:#1f6feb; }
textarea { width:100%; height:100px; padding:10px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:#e0e0e0; font-size:13px; resize:vertical; }
.status-done { color:#3fb950; }
.status-fail { color:#f85149; }
@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
.tag { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; margin:2px; cursor:pointer; background:#21262d; }
.tag.active { background:#1f6feb; color:#fff; }
.top-platform-tab.active { opacity:1 !important; }
.top-platform-tab:not(.active) { opacity:0.5; }
.toplist-layout { display:flex; gap:12px; }
.toplist-aside { width:120px; flex-shrink:0; max-height:70vh; overflow-y:auto; }
.toplist-aside .tag { display:block; text-align:center; margin:0 0 4px; border-radius:6px; padding:8px; font-size:12px; }
.toplist-main { flex:1; min-width:0; }
.toplist-sidebar-btn { display:none; }
.toplist-sidebar, .toplist-overlay { display:none; }
@media(max-width:600px){
  .toplist-layout { flex-direction:column; }
  .toplist-aside { width:100%; max-height:120px; display:flex; flex-wrap:wrap; gap:4px; }
  .toplist-aside .tag { display:inline-block; width:auto; }
}
.src-item { display:flex; align-items:center; padding:8px; border-bottom:1px solid #21262d; gap:8px; }
.src-item .name { flex:1; font-size:13px; }
.pl-item { display:flex; align-items:center; padding:12px; border-bottom:1px solid #21262d; cursor:pointer; }
.pl-item:hover { background:#161b22; }
.pl-item .icon { font-size:24px; margin-right:12px; }
.pl-item .info { flex:1; }
.pl-item .pl-name { font-size:15px; }
.pl-item .pl-count { color:#6e7681; font-size:12px; }
.switch { position:relative; width:36px; height:20px; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; inset:0; background:#30363d; border-radius:20px; cursor:pointer; }
.slider:before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
input:checked + .slider { background:#1f6feb; }
input:checked + .slider:before { transform:translateX(16px); }
.player-bar { position:fixed; bottom:0; left:0; right:0; background:rgba(22,27,34,0.95); backdrop-filter:blur(10px); border-top:1px solid #30363d; padding:8px 16px; display:flex; align-items:center; gap:10px; z-index:200; cursor:pointer; }
.player-bar .album-thumb { width:40px; height:40px; border-radius:6px; object-fit:cover; flex-shrink:0; background:#21262d; }
.player-bar .play-info { flex:1; min-width:0; }
.player-bar .play-title { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player-bar .play-artist { font-size:11px; color:#6e7681; }
.player-bar button { width:36px; height:36px; border-radius:50%; border:none; background:#1f6feb; color:#fff; cursor:pointer; font-size:16px; flex-shrink:0; }
.player-bar .time { font-size:11px; color:#6e7681; flex-shrink:0; min-width:80px; text-align:center; }
.play-btn { background:none; border:none; color:#58a6ff; cursor:pointer; font-size:14px; margin-left:8px; padding:4px 6px; flex-shrink:0; }
.play-btn:hover { color:#79b8ff; }
.progress-slider { width:100%; height:4px; background:#21262d; border-radius:2px; cursor:pointer; margin:6px 0; position:relative; }
.progress-slider .fill { height:100%; background:#1f6feb; border-radius:2px; width:0%; }
/* 大图播放器弹窗 */
.player-modal { position:fixed; inset:0; z-index:300; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); }
.player-modal.show { display:flex; }
.player-modal .bg-blur { position:absolute; inset:0; background-size:cover; background-position:center; filter:blur(60px) brightness(0.4); transition:background-image 0.5s; opacity:0.5; }
.player-modal .modal-content { position:relative; z-index:1; text-align:center; color:#fff; max-width:420px; padding:20px; width:90%; }
.player-modal .modal-pic { width:220px; height:220px; border-radius:12px; object-fit:cover; margin:0 auto 16px; box-shadow:0 10px 40px rgba(0,0,0,0.5); }
.player-modal .modal-title { font-size:18px; font-weight:bold; margin-bottom:4px; }
.player-modal .modal-artist { font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:12px; }
.player-modal .modal-progress { width:100%; height:4px; background:rgba(255,255,255,0.2); border-radius:2px; cursor:pointer; margin:12px 0; }
.player-modal .modal-progress .fill { height:100%; background:#1f6feb; border-radius:2px; width:0%; }
.player-modal .modal-time { display:flex; justify-content:space-between; font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:12px; }
.player-modal .modal-controls { display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:16px; }
.player-modal .modal-controls button { width:44px; height:44px; border-radius:50%; border:none; background:rgba(255,255,255,0.15); color:#fff; cursor:pointer; font-size:18px; }
.player-modal .modal-controls button.main { width:52px; height:52px; background:#1f6feb; font-size:22px; }
.player-modal .lyric-box { max-height:180px; overflow-y:auto; font-size:13px; line-height:2; color:rgba(255,255,255,0.7); text-align:center; scrollbar-width:none; -ms-overflow-style:none; }
.player-modal .lyric-box::-webkit-scrollbar { display:none; }
.player-modal .lyric-box .line { opacity:0.5; transition:opacity 0.3s; }
.player-modal .lyric-box .line.active { opacity:1; color:#fff; font-size:15px; font-weight:bold; }
.player-modal .close-btn { position:absolute; top:12px; right:12px; background:rgba(255,255,255,0.25); color:#fff; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:18px; z-index:5; }
@media(max-width:600px){
  .player-modal .modal-pic { width:180px; height:180px; }
  .player-modal .modal-title { font-size:16px; }
  .player-modal .lyric-box { max-height:140px; font-size:12px; }
  .toplist-aside { display:none; }
  .toplist-sidebar-btn { display:block; }
  .toplist-sidebar { display:block; position:fixed; left:0; top:48px; bottom:0; width:180px; background:#161b22; z-index:190; padding:12px; overflow-y:auto; transform:translateX(-100%); transition:transform 0.3s; box-shadow:2px 0 10px rgba(0,0,0,0.5); }
  .toplist-sidebar.open { transform:translateX(0); }
  .toplist-sidebar .tag { display:block; text-align:center; margin:0 0 4px; padding:8px; }
  .toplist-overlay { position:fixed; inset:0; top:48px; background:rgba(0,0,0,0.5); z-index:170; display:none; }
  .toplist-overlay.show { display:block; }
  #search-row2 { flex-wrap:wrap; }
  #search-row2 select { flex:1; min-width:80px; }
  #search-row2 button { flex:1; min-width:60px; }
}
</style>
</head>
<body>
<div class="topbar">
  <span class="app-title">NAS歌曲下载</span>
  <button class="settings-btn" onclick="openSettings()">⚙</button>
</div>
<div class="header">
  <button class="tab-btn active" data-tab="search">搜索</button>
  <button class="tab-btn" data-tab="toplist">排行榜</button>
  <button class="tab-btn" data-tab="playlist">我的歌单</button>
  <button class="tab-btn" data-tab="download">下载管理</button>
</div>
<div class="container">
  <div id="tab-search" class="tab-content">
    <div class="card">
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="输入歌名或歌手..." style="flex:1">
        <button class="btn btn-primary" onclick="doSearch()">搜索</button>
      </div>
      <div class="toolbar" id="search-row2">
        <select id="search-platform"><option value="163">网易云</option><option value="qq">QQ音乐</option></select>
        <select id="search-quality"><option value="128k">标准</option><option value="320k" selected>极高</option><option value="flac">无损</option></select>
        <button class="btn btn-primary btn-sm" onclick="downloadSelected('search')">下载选中</button>
        <button class="btn btn-sm" onclick="playSelected('search')">选中播放</button>
        <button class="btn btn-sm" onclick="playAll('search')">全部播放</button>
      </div>
      <div class="song-list" id="search-results"></div>
    </div>
  </div>
  <div id="tab-toplist" class="tab-content hidden">
    <div class="card">
      <div id="top-platform-tabs" style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap"></div>
      <div class="toplist-layout">
        <div class="toplist-aside" id="toplist-tags"></div>
        <div class="toplist-main">
          <div class="toolbar">
            <button class="btn btn-sm" onclick="selectAllToplist()">全选</button>
            <button class="btn btn-sm" onclick="invertSelectToplist()">反选</button>
            <button class="btn btn-sm" onclick="clearSelectToplist()">取消选择</button>
            <button class="btn btn-sm" onclick="playAll('toplist')">全部播放</button>
            <button class="btn btn-sm" onclick="playSelected('toplist')">选中播放</button>
            <select id="toplist-quality"><option value="128k">标准</option><option value="320k" selected>极高</option><option value="flac">无损</option></select>
            <button class="btn btn-primary btn-sm" onclick="downloadSelected('toplist')">下载选中</button>
          </div>
          <div class="song-list" id="toplist-results"></div>
        </div>
      </div>
    </div>
    <div class="toplist-overlay" id="toplist-overlay" onclick="closeToplistSidebar()"></div>
    <div class="toplist-sidebar" id="toplist-sidebar">
      <h4 id="toplist-sidebar-title" style="margin-bottom:10px;color:#58a6ff">网易榜单</h4>
      <div id="toplist-sidebar-tags"></div>
    </div>
  </div>
  <div id="tab-playlist" class="tab-content hidden">
    <div id="pl-list-view">
      <div class="card">
        <h3>我的歌单</h3>
        <div id="playlist-list"></div>
      </div>
    </div>
    <div id="pl-detail-view" class="hidden">
      <div class="card">
        <div class="toolbar">
          <button class="btn btn-sm" onclick="showPlaylistList()">← 返回</button>
          <h3 id="pl-title" style="margin:0"></h3>
        </div>
        <div class="toolbar">
          <button class="btn btn-sm" onclick="selectAllPlDetail()">全选</button>
          <button class="btn btn-sm" onclick="invertSelectPlDetail()">反选</button>
          <button class="btn btn-sm" onclick="clearSelectPlDetail()">取消选择</button>
          <button class="btn btn-sm" onclick="playAllPlDetail()">全部播放</button>
          <button class="btn btn-sm" onclick="playSelectedPlDetail()">选中播放</button>
          <select id="pl-quality"><option value="128k">标准</option><option value="320k" selected>极高</option><option value="flac">无损</option></select>
          <button class="btn btn-primary btn-sm" onclick="downloadPlDetail()">下载选中</button>
        </div>
        <div class="song-list" id="pl-detail-songs"></div>
      </div>
    </div>
  </div>
  <div id="tab-download" class="tab-content hidden">
    <div class="card">
      <h3>下载任务</h3>
      <div class="toolbar">
        <button class="btn btn-sm" id="btn-pause" onclick="togglePause()" disabled>暂停</button>
        <button class="btn btn-danger btn-sm" onclick="cancelDownload()">取消任务</button>
      </div>
      <div id="download-status">暂无下载任务</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="song-list" id="download-items" style="max-height:40vh"></div>
    </div>
    <div class="card">
      <h3>下载历史</h3>
      <div class="toolbar">
        <button class="btn btn-danger btn-sm" onclick="clearHistory()">清空历史</button>
      </div>
      <div class="song-list" id="download-history" style="max-height:40vh"></div>
    </div>
  </div>
</div>
<audio id="player" preload="none"></audio>
<div class="player-bar" id="player-bar" style="display:none" onclick="openPlayerModal()">
  <img class="album-thumb" id="album-thumb" src="" onerror="this.style.display='none'">
  <button id="play-pause-btn" onclick="event.stopPropagation();togglePlay()">▶</button>
  <div class="play-info">
    <div class="play-title" id="play-title">未播放</div>
    <div class="play-artist" id="play-artist"></div>
    <div class="progress-slider" onclick="event.stopPropagation();seekPlayer(event)"><div class="fill" id="play-progress"></div></div>
  </div>
  <span class="time" id="time-display">0:00 / 0:00</span>
  <button onclick="event.stopPropagation();stopPlay()" style="background:#30363d">⏹</button>
</div>
<!-- 大图播放器弹窗 -->
<div class="player-modal" id="player-modal">
  <div class="bg-blur" id="modal-bg"></div>
  <button class="close-btn" onclick="closePlayerModal()">✕</button>
  <div class="modal-content">
    <img class="modal-pic" id="modal-pic" src="" onerror="this.style.background='#21262d';this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'">
    <div class="modal-title" id="modal-title">未播放</div>
    <div class="modal-artist" id="modal-artist"></div>
    <div class="modal-progress" onclick="seekModalPlayer(event)"><div class="fill" id="modal-progress-fill"></div></div>
    <div class="modal-time"><span id="modal-current">0:00</span><span id="modal-duration">0:00</span></div>
    <div class="modal-controls">
      <button onclick="togglePlay()">⏮</button>
      <button class="main" onclick="togglePlay()" id="modal-play-btn">▶</button>
      <button onclick="togglePlay()">⏭</button>
    </div>
    <div class="lyric-box" id="lyric-box"></div>
  </div>
</div>
<!-- 设置页面 -->
<div id="tab-settings" class="tab-content hidden">
  <div class="card">
    <h3 style="color:#58a6ff;margin-bottom:16px">设置</h3>
    <h3 style="font-size:14px;color:#c9d1d9;margin-bottom:8px">音源管理</h3>
    <div id="source-list"></div>
    <div class="upload-area" onclick="document.getElementById('source-file').click()" style="margin-top:8px">
      点击上传音源 JS 文件
      <input type="file" id="source-file" accept=".js" style="display:none" onchange="uploadSource(this)">
    </div>
    <p class="tip" style="margin-top:8px">可上传多个音源，开关控制是否启用，挂了可删除重新上传</p>
    <h3 style="font-size:14px;color:#c9d1d9;margin:16px 0 8px">歌单管理</h3>
    <textarea id="paste-input" placeholder="粘贴歌单JSON或逐行输入：歌名-歌手" style="height:80px"></textarea>
    <div class="toolbar" style="margin-top:8px">
      <input type="text" id="new-pl-name" placeholder="歌单名称">
      <button class="btn btn-primary btn-sm" onclick="createPlaylist()">创建歌单</button>
    </div>
    <div class="upload-area" onclick="document.getElementById('file-input').click()" style="margin-top:8px">
      点击上传歌单 JSON 文件
      <input type="file" id="file-input" accept=".json" style="display:none" onchange="uploadPlaylistFile(this)">
    </div>
    <h3 style="font-size:14px;color:#c9d1d9;margin:16px 0 8px">榜单平台配置</h3>
    <p class="tip" style="font-size:12px;margin-bottom:6px">JSON格式，可新增/删除/修改平台，{id}为榜单ID占位符，保存后刷新生效</p>
    <textarea id="cfg-platforms" style="height:300px;font-size:11px;font-family:monospace"></textarea>
    <button class="btn btn-primary btn-sm" onclick="savePlatformConfig(this)">保存平台配置</button>
  </div>
</div>
<script>
var searchResults=[], toplistResults=[], currentPlaylist=null, currentTaskId=null, pollTimer=null;
var currentPlayBtn=null, playQueue=[], playQueueIdx=0;
var platformConfig={platforms:[]};
var currentTopPlatform='';
var currentTopLists={};
var deleteArmed=false,deleteTimer=null,srcDeleteArmed=null,srcDeleteTimer=null;

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.onclick=function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(function(t){t.classList.add('hidden');});
    document.getElementById('tab-'+btn.dataset.tab).classList.remove('hidden');
    if(btn.dataset.tab==='toplist' && !currentTopPlatform) loadPlatformConfig();
    if(btn.dataset.tab==='playlist') showPlaylistList();
    if(btn.dataset.tab==='settings') openSettings();
  };
});

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function songItemHTML(s, idx, source, cbIdx){
  var chk = cbIdx!==null ? '<input type="checkbox" class="checkbox" data-src="'+source+'" data-idx="'+cbIdx+'">' : '';
  return '<div class="song-item">'+chk+'<span class="idx">'+(idx+1)+'</span><span class="name">'+esc(s.title||s.name)+'</span><span class="artist">'+esc(s.artist||'')+'</span><button class="play-btn" data-title="'+esc(s.title||s.name)+'" data-artist="'+esc(s.artist||'')+'">▶</button></div>';
}

document.addEventListener('click', function(e){
  var btn = e.target.closest('.play-btn');
  if(btn){
    if(currentPlayBtn === btn && !audio.paused){
      togglePlay();
    } else {
      previewSong(btn.dataset.title, btn.dataset.artist, btn);
    }
  }
});

async function loadToplist(id){
  document.querySelectorAll('#toplist-tags .tag, #toplist-sidebar-tags .tag').forEach(function(t){t.classList.toggle('active', t.dataset.id===id);});
  document.getElementById('toplist-results').innerHTML='<p class="tip">加载中...</p>';
  try{
    var r=await fetch('/api/toplist?platform='+currentTopPlatform+'&listId='+id);
    var d=await r.json();
    toplistResults=d.results;
    document.getElementById('toplist-results').innerHTML=toplistResults.map(function(s,i){return songItemHTML(s,i,'toplist',i);}).join('');
  }catch(e){document.getElementById('toplist-results').innerHTML='<p class="status-fail">加载失败</p>';}
}

function switchTopPlatform(p){
  currentTopPlatform=p;
  var plat = platformConfig.platforms.find(x=>x.key===p);
  var lists = plat ? plat.lists : {};
  currentTopLists = lists;
  document.getElementById('toplist-sidebar-title').textContent = (plat?plat.name:'')+'榜单';
  var tagsHtml = Object.entries(lists).map(function(e,i){
    return '<span class="tag'+(i===0?' active':'')+'" data-id="'+e[0]+'" onclick="loadToplist(\''+e[0]+'\')">'+e[1]+'</span>';
  }).join('');
  document.getElementById('toplist-tags').innerHTML=tagsHtml;
  document.getElementById('toplist-sidebar-tags').innerHTML=Object.entries(lists).map(function(e){
    return '<span class="tag" data-id="'+e[0]+'" onclick="loadToplist(\''+e[0]+'\');closeToplistSidebar()">'+e[1]+'</span>';
  }).join('');
  loadToplist(Object.keys(lists)[0]);
  document.querySelectorAll('.top-platform-tab').forEach(function(t){t.classList.toggle('active', t.dataset.p===p);});
}

async function loadPlatformConfig(){
  try{
    platformConfig = await (await fetch('/api/config')).json();
    var html = platformConfig.platforms.map(function(p,i){
      return '<button class="top-platform-tab tag'+(i===0?' active':'')+'" data-p="'+p.key+'" onclick="switchTopPlatform(\''+p.key+'\');if(window.innerWidth<=600)openToplistSidebar()" style="margin:0;background:'+p.color+';color:#fff;border:none">'+(p.icon||'🎵')+' '+p.name+'</button>';
    }).join('');
    document.getElementById('top-platform-tabs').innerHTML = html;
    if(platformConfig.platforms.length) switchTopPlatform(platformConfig.platforms[0].key);
  }catch(e){}
}

async function doSearch(){
  var kw=document.getElementById('search-input').value.trim();
  if(!kw) return;
  var p=document.getElementById('search-platform').value;
  document.getElementById('search-results').innerHTML='<p class="tip">搜索中...</p>';
  try{
    var r=await fetch('/api/search?platform='+p+'&keyword='+encodeURIComponent(kw));
    var d=await r.json();
    searchResults=d.results||[];
    if(!searchResults.length){document.getElementById('search-results').innerHTML='<p class="tip">未找到结果</p>';return;}
    document.getElementById('search-results').innerHTML=searchResults.map(function(s,i){return songItemHTML(s,i,'search',i);}).join('');
  }catch(e){document.getElementById('search-results').innerHTML='<p class="status-fail">搜索失败</p>';}
}

function selectAllToplist(){document.querySelectorAll('#toplist-results .checkbox').forEach(function(c){c.checked=true;});}
function invertSelectToplist(){document.querySelectorAll('#toplist-results .checkbox').forEach(function(c){c.checked=!c.checked;});}
function clearSelectToplist(){document.querySelectorAll('#toplist-results .checkbox').forEach(function(c){c.checked=false;});}

function getSelected(src){
  return Array.from(document.querySelectorAll('.checkbox[data-src="'+src+'"]:checked')).map(function(cb){
    var a = src==='search' ? searchResults : toplistResults;
    return a[parseInt(cb.dataset.idx)];
  }).filter(Boolean);
}

function downloadSelected(src){
  var songs=getSelected(src);
  if(!songs.length){alert('请先选择歌曲');return;}
  var q = src==='toplist' ? document.getElementById('toplist-quality') : document.getElementById('search-quality');
  startDownload(songs, q);
}

async function showPlaylistList(){
  document.getElementById('pl-list-view').classList.remove('hidden');
  document.getElementById('pl-detail-view').classList.add('hidden');
  var r=await fetch('/api/playlists');
  var d=await r.json();
  if(!d.playlists.length){document.getElementById('playlist-list').innerHTML='<p class="tip">暂无歌单，请上传或创建</p>';return;}
  document.getElementById('playlist-list').innerHTML=d.playlists.map(function(p){
    return '<div class="pl-item" onclick="openPlaylist(\''+esc(p.name)+'\')"><span class="icon">🎵</span><div class="info"><div class="pl-name">'+esc(p.name)+'</div><div class="pl-count">'+p.count+' 首歌曲</div></div><button class="btn btn-sm" style="background:#da3633;color:#fff" onclick="event.stopPropagation();toggleDeletePlaylist(this,\''+esc(p.name)+'\')">删除</button></div>';
  }).join('');
}

function toggleDeletePlaylist(btn, name){
  if(deleteArmed===name){deletePlaylistByName(name);return;}
  deleteArmed=name; btn.textContent='确认删除?'; btn.style.background='#f85149';
  clearTimeout(deleteTimer);
  deleteTimer=setTimeout(function(){deleteArmed=false;btn.textContent='删除';btn.style.background='#da3633';},3000);
}
async function deletePlaylistByName(name){
  await fetch('/api/playlists/'+encodeURIComponent(name),{method:'DELETE'});
  deleteArmed=false; showPlaylistList();
}

async function openPlaylist(name){
  var r=await fetch('/api/playlists');
  var d=await r.json();
  var pl=d.playlists.find(function(p){return p.name===name;});
  if(!pl) return;
  currentPlaylist=pl;
  document.getElementById('pl-list-view').classList.add('hidden');
  document.getElementById('pl-detail-view').classList.remove('hidden');
  document.getElementById('pl-title').textContent=pl.name+' ('+pl.count+'首)';
  document.getElementById('pl-detail-songs').innerHTML=pl.songs.map(function(s,i){
    return '<div class="song-item"><input type="checkbox" class="checkbox pl-detail-cb" data-idx="'+i+'"><span class="idx">'+(i+1)+'</span><span class="name">'+esc(s.title||s.name)+'</span><span class="artist">'+esc(s.artist||'')+'</span><button class="play-btn" data-title="'+esc(s.title||s.name)+'" data-artist="'+esc(s.artist||'')+'">▶</button></div>';
  }).join('');
}

function selectAllPlDetail(){document.querySelectorAll('.pl-detail-cb').forEach(function(c){c.checked=true;});}
function invertSelectPlDetail(){document.querySelectorAll('.pl-detail-cb').forEach(function(c){c.checked=!c.checked;});}
function clearSelectPlDetail(){document.querySelectorAll('.pl-detail-cb').forEach(function(c){c.checked=false;});}

function playAllPlDetail(){
  if(!currentPlaylist||!currentPlaylist.songs||!currentPlaylist.songs.length) return;
  playQueue = currentPlaylist.songs.slice(); playQueueIdx = 0;
  playNextInQueue();
}
function playSelectedPlDetail(){
  var songs=Array.from(document.querySelectorAll('.pl-detail-cb:checked')).map(function(cb){
    return currentPlaylist.songs[parseInt(cb.dataset.idx)];
  }).filter(Boolean);
  if(!songs.length){alert('请先选择歌曲');return;}
  playQueue = songs.slice(); playQueueIdx = 0;
  playNextInQueue();
}

function downloadPlDetail(){
  var songs=Array.from(document.querySelectorAll('.pl-detail-cb:checked')).map(function(cb){
    return currentPlaylist.songs[parseInt(cb.dataset.idx)];
  }).filter(Boolean).map(function(s){return {title:s.title||s.name, artist:s.artist||''};});
  if(!songs.length){alert('请先选择歌曲');return;}
  startDownload(songs, document.getElementById('pl-quality'));
}

function parsePasteSongs(text){
  try{
    var d=JSON.parse(text);
    return (Array.isArray(d)?d:(d.songs||[])).map(function(s){
      return {title:s.name||s.title||s.song||'', artist:s.artist||s.author||s.singer||''};
    }).filter(function(s){return s.title;});
  }catch(e){
    return text.split('\n').filter(function(l){return l.trim();}).map(function(line){
      var p=line.split(/[-—–]/);
      return {title:(p[0]||'').trim(), artist:(p[1]||'').trim()};
    }).filter(function(s){return s.title;});
  }
}

async function createPlaylist(){
  var n=document.getElementById('new-pl-name').value.trim();
  var t=document.getElementById('paste-input').value.trim();
  if(!n){alert('请输入歌单名称');return;}
  if(!t){alert('请粘贴歌单内容');return;}
  var songs=parsePasteSongs(t);
  await fetch('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,songs:songs})});
  document.getElementById('new-pl-name').value='';
  document.getElementById('paste-input').value='';
  showPlaylistList();
}

async function uploadPlaylistFile(input){
  var f=input.files[0];
  if(!f) return;
  var text=await f.text();
  var songs=parsePasteSongs(text);
  await fetch('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name.replace('.json',''),songs:songs})});
  input.value='';
  showPlaylistList();
}

async function startDownload(songs, qSel){
  document.querySelector('[data-tab=download]').click();
  var q=qSel?qSel.value:'128k';
  document.getElementById('download-status').innerHTML='<b>提交中...</b>';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('download-items').innerHTML=songs.map(function(s,i){
    return '<div class="song-item"><span class="name">'+esc(s.title)+'</span><span class="artist">'+esc(s.artist||'')+'</span><button class="play-btn" data-title="'+esc(s.title)+'" data-artist="'+esc(s.artist||'')+'">▶</button><span style="margin-left:12px;min-width:50px;text-align:right" class="status-wait">排队中</span></div>';
  }).join('');
  var r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songs:songs,quality:q})});
  var d=await r.json();
  currentTaskId=d.taskId;
  document.getElementById('btn-pause').disabled=false;
  document.getElementById('btn-pause').textContent='暂停';
  pollStatus();
}

async function renderHistory(){
  try{
    var r=await fetch('/api/history');
    var d=await r.json();
    var hist=d.history||[];
    if(!hist.length){document.getElementById('download-history').innerHTML='<p class="tip">暂无下载记录</p>';return;}
    document.getElementById('download-history').innerHTML=hist.map(function(h,i){
      var d=new Date(h.time);
      var ts=(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
      return '<div class="song-item"><span class="idx">'+(i+1)+'</span><span class="name">'+esc(h.title)+'</span><span class="artist">'+esc(h.artist)+'</span><span class="tip" style="margin-left:8px">'+ts+'</span><button class="play-btn" data-title="'+esc(h.title)+'" data-artist="'+esc(h.artist)+'">▶</button></div>';
    }).join('');
  }catch(e){document.getElementById('download-history').innerHTML='<p class="tip">加载失败</p>';}
}
async function clearHistory(){await fetch('/api/history',{method:'DELETE'});renderHistory();}
function pollStatus(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(async function(){
    if(!currentTaskId) return;
    var r=await fetch('/api/download/'+currentTaskId);
    var t=await r.json();
    if(!t) return;
    var pct=t.done/t.total*100;
    var stText = t.status==='done'?'全部完成':t.status==='cancelled'?'已取消':'下载中';
    document.getElementById('download-status').innerHTML='<b>'+stText+' '+t.done+'/'+t.total+'</b>';
    document.getElementById('progress-fill').style.width=pct+'%';
    document.getElementById('download-items').innerHTML=t.items.map(function(i){
      var cls = i.status==='完成'?'status-done':(i.status==='失败'?'status-fail':'');
      return '<div class="song-item"><span class="name">'+esc(i.title)+'</span><span class="artist">'+esc(i.artist||'')+'</span><button class="play-btn" data-title="'+esc(i.title)+'" data-artist="'+esc(i.artist||'')+'">▶</button><span style="margin-left:12px;min-width:50px;text-align:right" class="'+cls+'">'+esc(i.status)+'</span></div>';
    }).join('');
    if(t.status==='done'||t.status==='cancelled'){
      clearInterval(pollTimer);
      document.getElementById('btn-pause').disabled=true;
      // 保存成功的到历史
      var newItems=[];
      t.items.forEach(function(i){
        if(i.status==='完成') newItems.push({title:i.title,artist:i.artist||'',time:Date.now()});
      });
      if(newItems.length) fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:newItems})}).then(renderHistory);
    }
  },500);
}

async function cancelDownload(){if(!currentTaskId)return;await fetch('/api/download/'+currentTaskId+'/cancel',{method:'POST'});}
async function togglePause(){
  if(!currentTaskId) return;
  var r=await fetch('/api/download/'+currentTaskId+'/pause',{method:'POST'});
  var d=await r.json();
  document.getElementById('btn-pause').textContent=d.paused?'继续':'暂停';
}

async function loadSourceList(){
  var r=await fetch('/api/sources');
  var d=await r.json();
  if(!d.sources.length){document.getElementById('source-list').innerHTML='<p class="tip">暂无音源</p>';return;}
  document.getElementById('source-list').innerHTML=d.sources.map(function(s){
    return '<div class="src-item"><span class="name">'+esc(s.name)+'</span><label class="switch"><input type="checkbox" '+(s.enabled?'checked':'')+' onchange="toggleSource('+s.id+')"><span class="slider"></span></label><button class="btn btn-danger btn-sm" onclick="toggleDeleteSource(this,'+s.id+')">删除</button></div>';
  }).join('');

function toggleDeleteSource(btn,id){
  if(srcDeleteArmed===id){deleteSource(id);return;}
  srcDeleteArmed=id; btn.textContent='确认删除?';
  clearTimeout(srcDeleteTimer);
  srcDeleteTimer=setTimeout(function(){srcDeleteArmed=null;btn.textContent='删除';},3000);
}
async function deleteSource(id){
  await fetch('/api/sources/'+id,{method:'DELETE'});
  srcDeleteArmed=null; loadSourceList();
}
async function toggleSource(id){await fetch('/api/sources/'+id+'/toggle',{method:'POST'});}
async function uploadSource(input){
  var f=input.files[0]; if(!f) return;
  var code=await f.text();
  var r=await fetch('/api/upload-source',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,filename:f.name})});

  if(d.ok) loadSourceList(); else alert('加载失败：'+d.error);

}

// ===== 播放器 =====
var audio=document.getElementById('player');
var currentLyrics=[], currentLyricIndex=0;
function fmtTime(s){ if(!s||isNaN(s))return'0:00'; var m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
async function previewSong(title, artist, btn){
  document.getElementById('player-bar').style.display='flex';
  document.getElementById('play-title').textContent=title;
  document.getElementById('play-artist').textContent=artist||'';
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-artist').textContent=artist||'';
  document.getElementById('play-pause-btn').textContent='...';
  document.getElementById('modal-play-btn').textContent='...';
  try{
    var r=await fetch('/api/preview?title='+encodeURIComponent(title)+'&artist='+encodeURIComponent(artist||''));
    var d=await r.json();
    if(d.error){alert('试听失败：'+d.error);return;}
    audio.src=d.url;
    await audio.play();
    document.getElementById('play-pause-btn').textContent='⏸';
    document.getElementById('modal-play-btn').textContent='⏸';
    if(currentPlayBtn) currentPlayBtn.textContent='▶';
    currentPlayBtn=btn;
    if(btn) btn.textContent='⏸';
    // 加载封面和歌词
    loadPic(title, artist);
    loadLyric(title, artist);
  }catch(e){alert('试听失败');}
}
async function loadPic(title, artist){
  try{
    var r=await fetch('/api/pic?title='+encodeURIComponent(title)+'&artist='+encodeURIComponent(artist||''));
    var d=await r.json();
    if(d.pic){
      document.getElementById('album-thumb').src=d.pic+'?param=100y100';
      document.getElementById('modal-pic').src=d.pic+'?param=400y400';
      document.getElementById('modal-bg').style.backgroundImage='url('+d.pic+')';
    }
  }catch(e){}
}
async function loadLyric(title, artist){
  try{
    var r=await fetch('/api/lyric?title='+encodeURIComponent(title)+'&artist='+encodeURIComponent(artist||''));
    var d=await r.json();
    currentLyrics=[]; currentLyricIndex=0;
    if(d.lyric){
      d.lyric.split('\n').forEach(function(line){
        var m=line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/);
        if(m){
          var t=parseInt(m[1])*60+parseInt(m[2])+parseInt(m[3])/1000;
          var text=line.replace(/\[.*?\]/g,'').trim();
          if(text) currentLyrics.push({time:t,text:text});
        }
      });
    }
    renderLyric(0);
  }catch(e){}
}
function renderLyric(curTime){
  var box=document.getElementById('lyric-box');
  if(!currentLyrics.length){box.innerHTML='<div class="line" style="opacity:0.3">暂无歌词</div>';return;}
  var idx=0;
  for(var i=0;i<currentLyrics.length;i++){ if(currentLyrics[i].time<=curTime) idx=i; }
  if(idx===currentLyricIndex) return;
  currentLyricIndex=idx;
  box.innerHTML=currentLyrics.map(function(l,i){
    return '<div class="line'+(i===idx?' active':'')+'" data-t="'+l.time+'">'+esc(l.text)+'</div>';
  }).join('');
  var active=box.querySelector('.line.active');
  if(active) active.scrollIntoView({block:'center',behavior:'smooth'});
}
function togglePlay(){
  if(!audio.src) return;
  if(audio.paused){audio.play();document.getElementById('play-pause-btn').textContent='⏸';document.getElementById('modal-play-btn').textContent='⏸';if(currentPlayBtn)currentPlayBtn.textContent='⏸';}
  else{audio.pause();document.getElementById('play-pause-btn').textContent='▶';document.getElementById('modal-play-btn').textContent='▶';if(currentPlayBtn)currentPlayBtn.textContent='▶';}
}
function stopPlay(){
  audio.pause(); audio.src='';
  document.getElementById('play-pause-btn').textContent='▶';
  document.getElementById('modal-play-btn').textContent='▶';
  if(currentPlayBtn){currentPlayBtn.textContent='▶';currentPlayBtn=null;}
  document.getElementById('play-title').textContent='未播放';
  document.getElementById('play-artist').textContent='';
  document.getElementById('play-progress').style.width='0%';
  document.getElementById('modal-progress-fill').style.width='0%';
  document.getElementById('time-display').textContent='0:00 / 0:00';
  document.getElementById('modal-current').textContent='0:00';
  document.getElementById('modal-duration').textContent='0:00';
  document.getElementById('lyric-box').innerHTML='';
}
audio.addEventListener('timeupdate',function(){
  if(audio.duration){
    var pct=(audio.currentTime/audio.duration*100);
    document.getElementById('play-progress').style.width=pct+'%';
    document.getElementById('modal-progress-fill').style.width=pct+'%';
    document.getElementById('time-display').textContent=fmtTime(audio.currentTime)+' / '+fmtTime(audio.duration);
    document.getElementById('modal-current').textContent=fmtTime(audio.currentTime);
    document.getElementById('modal-duration').textContent=fmtTime(audio.duration);
    renderLyric(audio.currentTime);
  }
});
audio.addEventListener('loadedmetadata',function(){
  document.getElementById('modal-duration').textContent=fmtTime(audio.duration);
});
function seekPlayer(e){
  var rect=e.currentTarget.getBoundingClientRect();
  var pct=(e.clientX-rect.left)/rect.width;
  if(audio.duration) audio.currentTime=pct*audio.duration;
}
function seekModalPlayer(e){
  var rect=e.currentTarget.getBoundingClientRect();
  var pct=(e.clientX-rect.left)/rect.width;
  if(audio.duration) audio.currentTime=pct*audio.duration;
}
function openPlayerModal(){ document.getElementById('player-modal').classList.add('show'); }
function closePlayerModal(){ document.getElementById('player-modal').classList.remove('show'); }
async function openSettings(){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.tab-content').forEach(function(t){t.classList.add('hidden');});
  document.getElementById('tab-settings').classList.remove('hidden');
  loadSourceList();
  try{var c=await (await fetch('/api/config')).json();
    document.getElementById('cfg-platforms').value = JSON.stringify(c.platforms, null, 2);
  }catch(e){}
}
async function savePlatformConfig(btn){
  try{
    var platforms = JSON.parse(document.getElementById('cfg-platforms').value);
    var origText = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span style="display:inline-block;animation:spin 1s linear infinite">⟳</span> 保存中...';
    await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platforms})});
    btn.innerHTML = '✓ 已保存';
    platformConfig = {platforms};
    loadPlatformConfig();
    setTimeout(function(){
      btn.disabled = false;
      btn.textContent = origText;
    }, 800);
  }catch(e){
    btn.disabled = false;
    btn.textContent = origText;
    alert('JSON格式错误: '+e.message);
  }
}
function closeSettings(){ document.getElementById('settings-modal').classList.remove('show'); }

// 播放队列
function playAll(src){
  var songs = src==='search' ? searchResults : toplistResults;
  if(!songs.length) return;
  playQueue = songs.slice(); playQueueIdx = 0;
  playNextInQueue();
}
function playSelected(src){
  var songs = getSelected(src);
  if(!songs.length){alert('请先选择歌曲');return;}
  playQueue = songs.slice(); playQueueIdx = 0;
  playNextInQueue();
}
function playNextInQueue(){
  if(playQueueIdx >= playQueue.length){ playQueue=[]; return; }
  var s = playQueue[playQueueIdx];
  playQueueIdx++;
  previewSong(s.title||s.name, s.artist||'', null);
}
audio.addEventListener('ended', function(){
  document.getElementById('play-pause-btn').textContent='▶';
  document.getElementById('modal-play-btn').textContent='▶';
  if(currentPlayBtn){currentPlayBtn.textContent='▶';currentPlayBtn=null;}
  if(playQueue.length) playNextInQueue();
});

document.getElementById('search-input').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});

// 初始化排行榜
loadPlatformConfig();
renderHistory();

function openToplistSidebar(){document.getElementById('toplist-sidebar').classList.add('open');document.getElementById('toplist-overlay').classList.add('show');}
function closeToplistSidebar(){document.getElementById('toplist-sidebar').classList.remove('open');document.getElementById('toplist-overlay').classList.remove('show');}
</script>
